server.port=3001
server.servlet.context-path=/api

spring.datasource.url=jdbc:sqlite:tasky-java.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

tasky.jwt.access-token-secret=dev-secret-change-in-production-32b
tasky.jwt.access-token-expiry=15m
tasky.jwt.refresh-token-expiry=7d
tasky.jwt.password-reset-token-expiry=1h